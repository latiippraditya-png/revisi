function saveTx(f){const v=Object.fromEntries(new FormData(f)),q=Number(v.qty),p=Number(v.price),er=[];
if(!v.date)er.push('Tanggal wajib diisi.');if(!v.desc.trim())er.push('Keterangan wajib diisi.');if(!v.cat)er.push('Pilih kategori.');if(!(Number.isInteger(q)&&q>=1))er.push('Jumlah minimal 1 (bilangan bulat).');if(!(p>0))er.push('Harga satuan harus lebih dari 0.');
if(er.length)return $('#er').innerHTML=er.join('<br>');
const o={date:v.date,desc:v.desc.trim(),type:v.type,cat:v.cat,qty:q,price:p,method:v.method,ref:v.ref.trim(),note:v.note.trim()},id=f.dataset.id;

function saveProd(f){const v=Object.fromEntries(new FormData(f)),pr=Number(v.price),sk=Number(v.stock),er=[],id=f.dataset.id;

function img(file){const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,400/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);pend=c.toDataURL('image/jpeg',.7);toast('Foto siap disimpan.')};i.src=r.result};r.readAsDataURL(file)}
function ready(){const T=new Date(),d=new Date(T);d.setDate(T.getDate()-29);const l=X.tx.filter(t=>t.date>=iso(d)),days=new Set(l.map(t=>t.date)).size,b=X.biz,ids=['name','owner','type','wa','addr'].filter(k=>(b[k]||'').trim()).length,hs=l.some(t=>t.type=='jual'),hk=l.some(t=>t.type=='keluar'),pp=X.prod,dok=pp.length?pp.reduce((a,p)=>a+((p.img?1:0)+(p.desc?1:0)+(p.story?1:0))/3,0)/pp.length:0;

const csum=(l,ty)=>{const m={};l.filter(t=>t.type==ty).forEach(t=>m[t.cat]=(m[t.cat]||0)+t.qty*t.price);const tot=Object.values(m).reduce((a,b)=>a+b,0);return Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${rp(v)}</td><td>${Math.round(v/tot*100)}%</td></tr>`).join('')||'<tr><td colspan="3" class="mut">Tidak ada data.</td></tr>'};

function insights(){const T=new Date(),y=T.getFullYear(),m=T.getMonth(),k=(f,t)=>sm(X.tx.filter(x=>x.date>=f&&x.date<=t)),k0=k(iso(new Date(y,m,1)),iso(T)),k1=k(iso(new Date(y,m-1,1)),iso(new Date(y,m,0))),l=cur(),s=sm(l),o=[];

function fillOrd(){const e=$('#ol2');if(!e)return;const f={perlu:['menunggu_konfirmasi'],aktif:['lunas','diproses','dikirim'],selesai:['selesai'],batal:['batal']}[OF],l=ORD.filter(o=>f.includes(o.status));e.innerHTML=l.length?l.map(ocard).join(''):'<div class="card">Belum ada pesanan di kategori ini.</div>'}
V.pesanan=()=>frame('pesanan',`<h1>\ud83e\uddfe Pesanan Masuk</h1><p class="mut small">Pesanan baru muncul di sini hanya setelah pembeli membayar dan mengirim bukti. Setelah Anda konfirmasi lunas, penjualan otomatis tercatat lengkap di Pembukuan dan Laporan, dan stok berkurang.</p>${user?'':'<div class="card">Masuk dengan akun agar pesanan online dari katalog Anda bisa diterima.</div>'}<div class="card row"><select id="of">${[['perlu','Perlu konfirmasi'],['aktif','Sedang diproses'],['selesai','Selesai'],['batal','Dibatalkan']].map(o=>`<option value="${o[0]}" ${OF==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div><div id="ol2"></div>`);
const ou=(o,p)=>sb.from('kp_order').update(p).eq('id',o.id).then(r=>{if(r.error)toast('Gagal: '+r.error.message);return!r.error});
A.bz=async id=>{const r=await sb.from('kp_order').select('bukti').eq('id',id).single();modal(`${r.data&&r.data.bukti?`<img src="${r.data.bukti}" alt="Bukti bayar" style="width:100%;border-radius:10px">`:'<p>Bukti tidak tersedia.</p>'}<div class="row"><button class="btn l" data-a="x">Tutup</button></div>`)};
A.ocf=id=>ask('Pastikan uang sudah masuk. Pesanan akan ditandai lunas dan langsung dicatat ke Pembukuan.',async()=>{const o=ORD.find(x=>x.id==id);if(!o)return;const t=new Date().toISOString();if(await ou(o,{status:'lunas',paid_at:t})){o.status='lunas';o.paid_at=t;rec(o);toast('Pesanan lunas dan tercatat di pembukuan.');nbadge();fillOrd()}});
A.otk=id=>modal(`<h3>Tolak bukti bayar</h3><label>Alasan (dilihat pembeli)</label><input id="orz" placeholder="mis. nominal tidak sesuai"><div class="row"><button class="btn d" data-a="otk2" data-i="${id}">Tolak</button><button class="btn l" data-a="x">Batal</button></div>`);
A.otk2=async id=>{const o=ORD.find(x=>x.id==id),z=($('#orz').value||'Bukti bayar tidak sesuai.').trim();dlg.close();if(o&&await ou(o,{status:'menunggu_bayar',bukti:null,d:{...o.d,alasan:z}})){ORD=ORD.filter(x=>x.id!=id);toast('Bukti ditolak. Pembeli diminta mengunggah ulang.');nbadge();fillOrd()}};
A.ost=async id=>{const o=ORD.find(x=>x.id==id),n=NXT[o.status][0];if(await ou(o,{status:n})){o.status=n;fillOrd()}};
A.obt=id=>ask('Batalkan pesanan ini? Penjualan akan dihapus dari Pembukuan dan stok dikembalikan. Pastikan refund ke pembeli sudah Anda urus.',async()=>{const o=ORD.find(x=>x.id==id);if(!o||!(await ou(o,{status:'batal'})))return;o.d.lines.forEach(l=>{const p=X.prod.find(x=>String(x.id)==String(l.id));if(p){p.stock=(+p.stock||0)+l.q;if(p.status=='Stok Habis')p.status='Tersedia'}});X.tx=X.tx.filter(t=>t.ord!=o.kode);o.status='batal';sv();toast('Pesanan dibatalkan dan pembukuan dikoreksi.');fillOrd()});
/* sisi pembeli */
A.osend0=A.osend;
A.osend=async()=>{if(!(PUB&&sb&&window.SLUG))return A.osend0();const L=cartLines(),b=pbk(),nm=$('#on').value.trim(),m=b.pm[PMI]||b.pm[0];if(!L.length)return;if(!nm){toast('Isi nama Anda dulu.');$('#on').focus();return}if(!m)return toast('Penjual belum menyediakan metode pembayaran.');ONAME=nm;const r=await sb.rpc('buat_pesanan',{p_slug:window.SLUG,p_nama:nm,p_catatan:$('#oc').value.trim(),p_hp:($('#oh')||{value:''}).value.trim(),p_metode:pml(m),p_mt:m.t,p_items:L.map(l=>({id:String(l.p.id),q:l.q}))});if(r.error||!r.data)return toast('Gagal membuat pesanan: '+((r.error&&r.error.message)||'coba lagi'));CART={};cbar();dlg.close();location.hash='bayar-'+r.data.kode+'-'+r.data.token};
async function bayar(s){const i=s.lastIndexOf('-'),kode=s.slice(0,i),token=s.slice(i+1),w=t=>`<div class="w" style="max-width:520px;padding:24px 16px">${t}</div>`;BK={kode,token};window.BUKTI=null;$('#root').innerHTML=w('Memuat pesanan...');if(!sb)return $('#root').innerHTML=w('<div class="card">Fitur pesanan online belum aktif.</div>');const r=await sb.rpc('status_pesanan',{p_kode:kode,p_token:token}),o=r.data;if(!o)return $('#root').innerHTML=w('<div class="card">Pesanan tidak ditemukan. Periksa kembali tautan Anda.</div>');const d=o.d,exp=o.status=='menunggu_bayar'&&Date.now()-new Date(o.created_at)>864e5;let pm='';if(o.status=='menunggu_bayar'&&!exp){try{PUB=(await sb.rpc('katalog_publik',{p_slug:d.slug})).data}catch(e){}const l=PUB?pbk().pm:[];pm=pmd(l.find(m=>pml(m)==d.m)||l[0])}
$('#root').innerHTML=w(`<h1>Pesanan ${esc(kode)}</h1><div class="card"><span class="badge">${exp?'Kedaluwarsa':STL[o.status]}</span><p class="small mut" style="margin:6px 0">${wt(o.created_at)} \u00b7 a.n. ${esc(d.nama)}</p>${d.lines.map(l=>`<div class="small">${l.q}\u00d7 ${esc(l.name)} = ${rp(l.q*l.price)}</div>`).join('')}<p class="big" style="margin:8px 0 0">Total bayar: ${rp(d.total)}</p></div>${o.status=='menunggu_bayar'&&!exp?`<div class="card"><h3 style="margin-top:0">Langkah pembayaran</h3><p class="small">1. Bayar <b>${rp(d.total)}</b> (${esc(d.m)}):</p>${pm||'<p class="small mut">Hubungi penjual untuk cara bayar.</p>'}<p class="small">2. Unggah bukti bayar. Pesanan baru diteruskan ke penjual setelah bukti terkirim. Batas waktu 24 jam.</p>${d.alasan?`<p class="err">Bukti sebelumnya ditolak: ${esc(d.alasan)}</p>`:''}<input type="file" accept="image/*" id="bf"><div class="row"><button type="button" class="btn o" data-a="bsend">Saya sudah bayar, kirim bukti</button></div></div>`:exp?'<div class="card">Batas waktu pembayaran sudah lewat. Silakan buat pesanan baru.</div>':'<div class="card small">Simpan halaman ini untuk memantau status pesanan Anda.</div>'}<p class="small mut">Pembayaran dilakukan langsung ke penjual. KREASI PAY tidak memproses atau menahan dana. <a href="#bayar-${esc(s)}" data-a="bref" style="text-decoration:underline">Muat ulang status</a></p>`)}
A.bsend=async()=>{if(!window.BUKTI)return toast('Pilih foto bukti bayar dulu.');const r=await sb.rpc('kirim_bukti',{p_kode:BK.kode,p_token:BK.token,p_bukti:window.BUKTI});if(r.data===true){toast('Bukti terkirim. Penjual akan mengonfirmasi.');bayar(BK.kode+'-'+BK.token)}else toast('Gagal mengirim bukti. Pesanan mungkin sudah kedaluwarsa.')};
A.bref=()=>bayar(BK.kode+'-'+BK.token);
document.addEventListener('change',e=>{const t=e.target;if(t.id=='bf'&&t.files[0])rz(t.files[0],900,d=>{window.BUKTI=d;toast('Bukti siap dikirim.')});else if(t.id=='of'){OF=t.value;fillOrd()}});
setInterval(()=>{if(user)pullOrd(1)},15000);setTimeout(()=>user&&pullOrd(1),2500);
